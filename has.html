<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    h1:has(~ h3){
      color:blue;
    }
    h1:hover ~ h3{
      color: red;
    }
    h2 ~ h4{
      color: Green;
    }
    div > ul{
      color: red;
    }
  </style>
</head>

<body>
  <h1>h1</h1>
  <h2>h2</h2>
  <h3>h3</h3>
  <h4>h4</h4>
  <div>
    <ul>
      <li>item 1</li>
    </ul>
    <ul>
      <li>item2</li>
    </ul>
  </div>
</body>

</html>
