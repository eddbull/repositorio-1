<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body{
      background: linear-gradient(blue, black);
      height: 150vh;
    }
    div{
      width: 16ch;
      height: 2ch;
      position: fixed;
      bottom: 5px;
      display: flex;
      align-items: center;
      border-radius: 2px;
      overflow: hidden;
      background: #FFFFFFA6;
    }
    p{
      animation: ss 8s linear infinite;
      border-radius: 5px;
      /*background: #FFFFFFA6;*/
    }
    div:hover{
      background: #FFFFFF99;
      width: 95dvw;
      box-shadow: 0 0 5px 2px red;
    }
    div:hover p{
      animation: none;
      transform: translateX(0);
    }
    div, div:hover,p{
      transition: 1s;
    }
    @keyframes ss{
      0%,67%,100%{
        /*transform: translateX(0);*/
        opacity: 1;
      }
      0%,20%{
        transform: translateX(0);
      }
      33%{
        transform: translateX(17ch);
        opacity: 1;
      }
      34%{
        opacity: 0;
      }
      66%{
        transform: translateX(-17ch);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div>
    <p>como estao voces?</p>
  </div>
</body>

</html>
